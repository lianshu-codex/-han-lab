<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>拼花小作坊</title>
  <style>
    :root{--ink:#31455a;--blue:#4a91c7;--deep:#2e6592;--cream:#fff9ea;--paper:#fffdf7;--orange:#ed9350;--rose:#e87880;--green:#76ad78;}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:var(--ink);background:#dceff3;overflow-x:hidden}
    body:before,body:after{content:"";position:fixed;z-index:-1;border-radius:50%;opacity:.7}body:before{width:460px;height:460px;top:-220px;left:-130px;background:#f8d78e}body:after{width:520px;height:420px;right:-220px;bottom:-190px;background:#a7d4be}
    .page{width:min(1100px,calc(100% - 32px));margin:24px auto 34px}.header{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.mark{width:57px;height:57px;display:grid;place-items:center;font-size:31px;background:var(--paper);border:3px solid white;border-radius:23px 17px 21px 14px;box-shadow:0 6px 0 rgba(67,104,126,.16);transform:rotate(-5deg)}h1{margin:0;color:var(--deep);font-size:clamp(25px,4vw,37px);letter-spacing:2px}.subtitle{margin-top:2px;color:#7190a4;font-size:13px;font-weight:700;letter-spacing:1px}.badge{background:#fff0c7;color:#936b31;padding:10px 15px;border:2px solid #fff9e4;border-radius:19px 23px 16px 20px;font-weight:800;box-shadow:0 4px 0 rgba(132,102,57,.13);transform:rotate(2deg)}
    .layout{display:grid;grid-template-columns:1fr 270px;gap:18px;align-items:start}.studio{position:relative;padding:21px;background:var(--cream);border:6px solid #fffdf4;border-radius:34px 26px 36px 29px;box-shadow:0 10px 0 rgba(70,112,136,.16),inset 0 0 0 2px #e7d0a9}.studio:before{content:"";position:absolute;inset:11px;border:2px dashed #bcd9d4;border-radius:26px 18px 28px 20px;pointer-events:none}.instruction{position:relative;z-index:1;margin:0 0 13px;text-align:center;color:#66869c;font-size:14px;font-weight:800}.instruction b{color:var(--orange)}
    .puzzle-board{position:relative;z-index:1;width:min(100%,620px);aspect-ratio:1;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:7px;background:#c8e2d5;border-radius:20px 17px 22px 16px;box-shadow:inset 0 0 0 2px #fff7d5}.slot{min-width:0;position:relative;border-radius:12px 15px 11px 14px;background:rgba(255,255,255,.33);outline:1px dashed rgba(70,119,122,.28);transition:transform .15s,background .15s}.slot:nth-child(3n){border-radius:15px 11px 14px 12px}.slot.over{background:#ffe4a6;transform:scale(.97)}
    .piece{width:100%;height:100%;border:0;cursor:grab;border-radius:12px 15px 11px 14px;background-image:radial-gradient(ellipse 34% 48% at 50% 50%,#f4bb42 0 17%,#b87531 18% 25%,transparent 26%),radial-gradient(ellipse 24% 42% at 31% 39%,#e6767f 0 48%,transparent 50%),radial-gradient(ellipse 24% 42% at 69% 39%,#e87883 0 48%,transparent 50%),radial-gradient(ellipse 25% 42% at 28% 67%,#df6880 0 48%,transparent 50%),radial-gradient(ellipse 25% 42% at 72% 67%,#e8858b 0 48%,transparent 50%),radial-gradient(ellipse 22% 39% at 50% 21%,#f09b94 0 48%,transparent 50%),radial-gradient(ellipse 22% 39% at 50% 80%,#db7180 0 48%,transparent 50%),radial-gradient(ellipse 18% 35% at 13% 75%,#75ad75 0 50%,transparent 52%),radial-gradient(ellipse 18% 35% at 87% 77%,#66a372 0 50%,transparent 52%),linear-gradient(135deg,#bce1df,#e8f3d9 49%,#b2d9c5);background-size:400% 400%;background-position:var(--x) var(--y);box-shadow:0 3px 0 rgba(102,92,68,.24),0 4px 8px rgba(74,109,114,.13);transition:transform .15s,filter .15s,box-shadow .15s;touch-action:none}.piece:nth-child(2n){border-radius:15px 11px 14px 12px}.piece:hover{transform:translateY(-2px) rotate(-1deg);filter:saturate(1.08);box-shadow:0 5px 0 rgba(102,92,68,.22),0 7px 10px rgba(74,109,114,.14)}.piece:active{cursor:grabbing}.piece.selected{outline:4px solid #efa152;outline-offset:-4px;transform:scale(.94);box-shadow:0 0 0 3px #fff8d2,0 3px 0 #bd713a}.piece.correct{animation:pop .36s ease both}@keyframes pop{50%{transform:scale(.88)}100%{transform:scale(1)}}
    .tray-label{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;margin:18px 3px 8px;color:#6d8999;font-size:14px;font-weight:800}.tray-label span{font-size:12px;color:#9aafb6}.tray{position:relative;z-index:1;display:grid;grid-template-columns:repeat(8,1fr);gap:7px;min-height:75px;padding:8px;background:#f0f7eb;border:2px solid #fff;border-radius:18px 15px 19px 14px}.tray .piece{aspect-ratio:1}
    .side{display:grid;gap:14px}.card{background:var(--paper);border:3px solid #fff;border-radius:23px 18px 22px 16px;padding:18px;box-shadow:0 6px 0 rgba(71,107,126,.14)}.card h2{margin:0 0 13px;color:#63839c;font-size:15px;letter-spacing:1px}.time-row{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;color:#678298}#time{font-size:32px;color:var(--deep);font-weight:900}.progress{height:13px;border-radius:99px;background:#e1eff0;margin-top:10px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#72c4af,#f4c76a);border-radius:inherit;transition:width .25s}.count{margin-top:15px;padding-top:13px;border-top:2px dashed #d9e6df;display:flex;justify-content:space-between;color:#6c8797;font-weight:700}.count strong{color:var(--rose);font-size:20px}.action{border:0;cursor:pointer;padding:13px;border-radius:16px 19px 15px 18px;color:#fff;font:800 15px "Microsoft YaHei",sans-serif;box-shadow:0 4px 0 rgba(70,88,92,.2);transition:transform .15s,box-shadow .15s}.action:hover{transform:translateY(-2px);box-shadow:0 6px 0 rgba(70,88,92,.18)}.reset{background:var(--blue);width:100%}.note{background:#eff8f0;transform:rotate(-1deg)}.note p{margin:0;color:#668177;line-height:1.7;font-size:14px;font-weight:600}.flower{position:absolute;font-size:33px;filter:drop-shadow(0 3px 0 rgba(75,113,105,.1))}.one{left:-26px;top:142px}.two{right:-21px;bottom:-16px}
    .toast{position:fixed;z-index:10;left:50%;top:25px;transform:translate(-50%,-130px);padding:12px 19px;border-radius:18px;color:white;background:#406f8c;font-weight:700;box-shadow:0 5px 0 rgba(0,0,0,.14);transition:transform .25s}.toast.show{transform:translate(-50%,0)}.overlay{position:fixed;z-index:20;inset:0;display:none;place-items:center;padding:20px;background:rgba(37,76,99,.42);backdrop-filter:blur(3px)}.overlay.show{display:grid}.modal{width:min(380px,100%);padding:31px 28px 27px;text-align:center;background:var(--cream);border:6px solid #fffdf4;border-radius:35px 27px 37px 25px;box-shadow:0 12px 0 rgba(35,69,86,.2)}.modal .big{font-size:65px}.modal h2{font-size:29px;color:var(--deep);margin:7px 0}.modal p{color:#698396;font-weight:700}.modal .action{width:100%;margin-top:10px;background:var(--orange)}
    @media(max-width:830px){.layout{grid-template-columns:1fr}.side{grid-template-columns:repeat(3,1fr)}.card:last-child{grid-column:span 2}.tray{grid-template-columns:repeat(8,1fr)}}@media(max-width:560px){.page{width:calc(100% - 18px);margin-top:12px}.mark{width:48px;height:48px;font-size:25px}.badge{font-size:12px;padding:9px}.studio{padding:10px;border-width:4px}.puzzle-board{gap:3px;padding:5px}.tray{gap:4px;padding:5px}.side{grid-template-columns:1fr 1fr}.side .card:first-child{grid-column:span 2}.card:last-child{grid-column:span 2}.flower{display:none}}
  </style>
</head>
<body>
  <main class="page">
    <header class="header"><div class="brand"><div class="mark">🌺</div><div><h1>拼花小作坊</h1><div class="subtitle">把春天的花朵拼回原来的样子</div></div></div><div class="badge">第 1 关 · 春日花园</div></header>
    <div class="layout"><section class="studio"><p class="instruction">把下方的 <b>16 块花瓣碎片</b> 拖到正确的位置</p><div class="puzzle-board" id="board" aria-label="拼图板"></div><div class="tray-label">待拼碎片 <span>也可以先点一块，再点目标位置</span></div><div class="tray" id="tray" aria-label="拼图碎片托盘"></div></section>
      <aside class="side"><section class="card"><h2>花园时钟</h2><div class="time-row"><span>用时</span><span id="time">00:00</span></div><div class="progress"><i id="progress"></i></div><div class="count"><span>已经归位</span><strong id="count">0 / 16</strong></div></section><button class="action reset" id="reset">↻ 重新拼花</button><section class="card note"><h2>小画家提示</h2><p>先找花心，再让颜色和枝叶自然接上，拼起来会更轻松！</p></section></aside></div>
    <span class="flower one">🌷</span><span class="flower two">🌻</span>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div><div class="overlay" id="overlay"><section class="modal"><div class="big">🎨</div><h2>拼花完成！</h2><p id="result">这朵春日花开得真美！</p><button class="action" id="again">再拼一次</button></section></div>
  <script>
    const board=document.getElementById('board'),tray=document.getElementById('tray'),timeEl=document.getElementById('time'),countEl=document.getElementById('count'),progressEl=document.getElementById('progress');
    let pieces=[], selected=null, seconds=0, clock=null, solved=false;
    const positions=Array.from({length:16},(_,i)=>({x:(i%4)*100/3+'%',y:Math.floor(i/4)*100/3+'%'}));
    function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
    function makePiece(id){const b=document.createElement('button');b.type='button';b.className='piece';b.draggable=true;b.dataset.id=id;b.style.setProperty('--x',positions[id].x);b.style.setProperty('--y',positions[id].y);b.setAttribute('aria-label','花朵碎片 '+(id+1));b.addEventListener('click',()=>selectPiece(b));b.addEventListener('dragstart',e=>{selected=b;e.dataTransfer.setData('text/plain',id);setTimeout(()=>b.style.opacity='.35',0)});b.addEventListener('dragend',()=>b.style.opacity='');return b}
    function setup(){clearInterval(clock);board.innerHTML='';tray.innerHTML='';selected=null;seconds=0;solved=false;pieces=Array.from({length:16},(_,i)=>makePiece(i));for(let i=0;i<16;i++){const s=document.createElement('div');s.className='slot';s.dataset.slot=i;s.addEventListener('dragover',e=>{e.preventDefault();s.classList.add('over')});s.addEventListener('dragleave',()=>s.classList.remove('over'));s.addEventListener('drop',e=>{e.preventDefault();s.classList.remove('over');place(s,selected)});s.addEventListener('click',()=>{if(selected)place(s,selected)});board.appendChild(s)}shuffle(pieces).forEach(p=>tray.appendChild(p));update();clock=setInterval(()=>{seconds++;update()},1000)}
    function selectPiece(piece){if(solved)return;if(selected===piece){piece.classList.remove('selected');selected=null;return}if(selected)selected.classList.remove('selected');selected=piece;piece.classList.add('selected')}
    function place(slot,piece){if(!piece||solved)return;const occupied=slot.firstElementChild;if(occupied){tray.appendChild(occupied);occupied.classList.remove('correct')}slot.appendChild(piece);piece.classList.remove('selected');selected=null;check()}
    function check(){let right=0;document.querySelectorAll('.slot').forEach(slot=>{const piece=slot.firstElementChild;const yes=piece&&Number(piece.dataset.id)===Number(slot.dataset.slot);slot.classList.toggle('over',false);if(yes){right++;piece.classList.add('correct')}else if(piece)piece.classList.remove('correct')});update(right);if(right===16){solved=true;clearInterval(clock);document.getElementById('result').textContent=`用了 ${timeEl.textContent}，春日花朵成功绽放！`;document.getElementById('overlay').classList.add('show')}}
    function update(right){if(right===undefined)right=[...document.querySelectorAll('.slot')].filter(s=>s.firstElementChild&&Number(s.firstElementChild.dataset.id)===Number(s.dataset.slot)).length;const m=Math.floor(seconds/60),s=seconds%60;timeEl.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');countEl.textContent=right+' / 16';progressEl.style.width=(right/16*100)+'%'}
    let toastTimer;function message(text){const t=document.getElementById('toast');t.textContent=text;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1500)}
    document.getElementById('reset').addEventListener('click',()=>{setup();message('碎片已重新打散，开始拼花吧！')});document.getElementById('again').addEventListener('click',()=>{document.getElementById('overlay').classList.remove('show');setup()});setup();
  </script>
</body>
</html>
