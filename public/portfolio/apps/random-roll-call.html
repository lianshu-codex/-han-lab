<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f7faff" />
  <title>课堂随机点名</title>
  <style>
    /* =========================
       课堂随机点名 · 全局样式
       ========================= */
    :root {
      --navy: #123e8a;
      --blue: #2f80ed;
      --blue-dark: #2368c5;
      --blue-pale: #eaf4ff;
      --blue-wash: #f2f7ff;
      --orange: #ff8a1f;
      --orange-pale: #fff2e5;
      --green: #2bb673;
      --green-pale: #e7f8f0;
      --ink: #1f3352;
      --muted: #72829c;
      --line: #dfeaf7;
      --white: #ffffff;
      --shadow-sm: 0 7px 20px rgba(34, 83, 144, 0.08);
      --shadow-md: 0 16px 38px rgba(34, 83, 144, 0.12);
      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-sm: 11px;
    }

    * { box-sizing: border-box; }

    html { min-width: 320px; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--blue-wash);
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
      outline: 3px solid rgba(47, 128, 237, 0.26);
      outline-offset: 2px;
    }

    .app-shell {
      display: grid;
      grid-template-columns: minmax(218px, 18%) minmax(500px, 1fr) minmax(285px, 25%);
      gap: 22px;
      width: min(1600px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: 24px;
    }

    .sidebar, .rollcall-card, .progress-card, .roster-card {
      background: var(--white);
      border: 1px solid rgba(193, 215, 239, 0.78);
      box-shadow: var(--shadow-sm);
    }

    /* =========================
       左侧导航
       ========================= */
    .sidebar {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: calc(100vh - 48px);
      padding: 25px 17px 18px;
      overflow: hidden;
      border-radius: var(--radius-lg);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 0 8px;
    }

    .brand-mark {
      display: grid;
      flex: 0 0 auto;
      width: 42px;
      height: 42px;
      place-items: center;
      color: var(--white);
      background: var(--blue);
      border-radius: 13px;
      box-shadow: 0 7px 15px rgba(47, 128, 237, 0.2);
    }

    .brand-mark svg { width: 24px; height: 24px; }

    .brand-title {
      margin: 0;
      color: var(--navy);
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 0.01em;
    }

    .brand-subtitle {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.55;
    }

    .nav-list {
      display: grid;
      gap: 7px;
      margin-top: 39px;
    }

    .nav-button {
      display: flex;
      align-items: center;
      gap: 11px;
      width: 100%;
      min-height: 47px;
      padding: 0 13px;
      color: #687b98;
      text-align: left;
      background: transparent;
      border: 0;
      border-radius: 13px;
      transition: background 180ms ease, color 180ms ease, transform 180ms ease;
    }

    .nav-button:hover { color: var(--blue); background: var(--blue-wash); transform: translateX(2px); }
    .nav-button.active { color: var(--blue); font-weight: 700; background: var(--blue-pale); }
    .nav-icon { display: grid; width: 20px; height: 20px; place-items: center; flex: 0 0 auto; }
    .nav-icon svg { width: 19px; height: 19px; }
    .nav-button span:last-child { font-size: 13px; }

    .sidebar-note {
      position: relative;
      z-index: 1;
      margin: auto 8px 0;
      padding: 15px 12px 14px;
      color: var(--navy);
      background: var(--blue-pale);
      border-radius: 15px;
    }

    .sidebar-note p { margin: 0; font-size: 12px; line-height: 1.65; }
    .sidebar-note strong { display: block; margin-bottom: 4px; font-size: 12px; }

    .sidebar-sketch {
      position: absolute;
      right: 14px;
      bottom: 12px;
      width: 93px;
      height: 53px;
      color: #96c5f6;
      pointer-events: none;
    }

    .sidebar-sketch svg { width: 100%; height: 100%; }

    /* =========================
       中间点名区域
       ========================= */
    .main-column { min-width: 0; }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 50px;
      gap: 12px;
      margin-bottom: 16px;
    }

    .topbar-context { min-width: 0; }
    .topbar-context p { margin: 0; color: var(--muted); font-size: 12px; }
    .topbar-context strong { display: block; margin-top: 4px; color: var(--navy); font-size: 15px; }

    .topbar-actions { display: flex; align-items: center; gap: 10px; }

    .class-select-wrap {
      position: relative;
      display: flex;
      align-items: center;
      min-width: 145px;
    }

    .class-select-wrap svg { position: absolute; left: 13px; width: 16px; height: 16px; color: var(--blue); pointer-events: none; }

    .class-select {
      width: 100%;
      padding: 10px 28px 10px 35px;
      color: var(--navy);
      font-size: 13px;
      font-weight: 700;
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 12px;
      outline: none;
      box-shadow: 0 3px 9px rgba(34, 83, 144, 0.04);
    }

    .sound-button, .icon-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 40px;
      color: #6e809c;
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 12px;
      transition: transform 160ms ease, color 160ms ease, background 160ms ease, border 160ms ease;
    }

    .sound-button { padding: 0 12px; font-size: 12px; }
    .sound-button svg { width: 17px; height: 17px; }
    .sound-button:hover, .icon-button:hover { color: var(--blue); border-color: #b7d5f6; background: var(--blue-wash); transform: translateY(-1px); }
    .sound-button.on { color: var(--green); background: var(--green-pale); border-color: #bcead3; }

    .rollcall-card {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 535px;
      padding: 34px clamp(22px, 5vw, 72px) 28px;
      overflow: hidden;
      border-radius: var(--radius-lg);
    }

    .paper-dot { position: absolute; width: 6px; height: 6px; background: #a9d4fa; border-radius: 50%; opacity: 0.72; }
    .paper-dot.dot-one { top: 57px; left: 9%; }
    .paper-dot.dot-two { top: 125px; right: 12%; width: 4px; height: 4px; background: #ffc487; }
    .paper-dot.dot-three { right: 24%; bottom: 45px; width: 5px; height: 5px; }

    .rollcall-heading { position: relative; z-index: 1; text-align: center; }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--blue);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .eyebrow::before, .eyebrow::after { display: block; width: 21px; height: 1px; content: ""; background: #b8d9f7; }

    .name-stage {
      position: relative;
      display: grid;
      min-height: 252px;
      place-items: center;
      padding: 18px 0 8px;
    }

    .name-stage::before, .name-stage::after {
      position: absolute;
      top: 50%;
      width: 50px;
      height: 30px;
      content: "";
      opacity: 0.8;
      background: repeating-linear-gradient(0deg, transparent 0 9px, #c3def8 9px 10px);
    }
    .name-stage::before { left: 0; transform: translateY(-30%) rotate(-9deg); }
    .name-stage::after { right: 0; transform: translateY(-30%) rotate(9deg); }

    .name-display {
      position: relative;
      z-index: 1;
      max-width: 100%;
      margin: 0;
      padding: 0 14px 19px;
      color: var(--navy);
      font-size: clamp(64px, 8vw, 130px);
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: 0.08em;
      text-align: center;
      word-break: keep-all;
      text-shadow: 0 3px 0 rgba(234, 244, 255, 0.95);
    }

    .name-display::after {
      position: absolute;
      right: 18%;
      bottom: 0;
      left: 18%;
      height: 9px;
      content: "";
      background: var(--orange);
      border-radius: 50%;
      opacity: 0.9;
      transform: rotate(-1.4deg);
    }

    .name-display.rolling { color: var(--blue); opacity: 0.88; }
    .name-display.celebrate { animation: nameCelebrate 320ms cubic-bezier(.2,.9,.3,1.2); }
    @keyframes nameCelebrate {
      0% { transform: scale(0.95); }
      58% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    .result-sparkles { position: absolute; inset: 12px 4% 0; pointer-events: none; }
    .spark { position: absolute; color: var(--orange); font-size: 19px; opacity: 0; }
    .spark:nth-child(1) { top: 16%; left: 19%; }
    .spark:nth-child(2) { top: 30%; right: 20%; color: var(--blue); font-size: 14px; }
    .spark:nth-child(3) { right: 13%; bottom: 17%; color: var(--green); font-size: 16px; }
    .spark:nth-child(4) { bottom: 26%; left: 14%; color: #f4b04f; font-size: 13px; }
    .spark.active { animation: sparkIn 650ms ease-out forwards; }
    @keyframes sparkIn {
      0% { opacity: 0; transform: translateY(6px) scale(0.55) rotate(-15deg); }
      35% { opacity: 1; }
      100% { opacity: 0; transform: translateY(-18px) scale(1) rotate(12deg); }
    }

    .rollcall-actions { display: flex; justify-content: center; margin-top: 7px; }
    .primary-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-width: 184px;
      min-height: 54px;
      padding: 0 25px;
      color: var(--white);
      font-size: 17px;
      font-weight: 800;
      background: var(--orange);
      border: 0;
      border-radius: 17px;
      box-shadow: 0 9px 0 #e97612, 0 15px 23px rgba(255, 138, 31, 0.21);
      transition: transform 140ms ease, box-shadow 140ms ease, background 140ms ease;
    }
    .primary-button:hover { background: #ff941f; transform: translateY(-2px); box-shadow: 0 11px 0 #e97612, 0 18px 25px rgba(255, 138, 31, 0.24); }
    .primary-button:active { transform: translateY(4px); box-shadow: 0 4px 0 #e97612, 0 8px 13px rgba(255, 138, 31, 0.16); }
    .primary-button:disabled { cursor: not-allowed; opacity: 0.64; transform: none; box-shadow: 0 5px 0 #e97612; }
    .primary-button svg { width: 18px; height: 18px; fill: currentColor; }

    .mode-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 17px;
      margin-top: 26px;
      color: var(--muted);
      font-size: 12px;
    }

    .check-label { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; }
    .check-label input { width: 16px; height: 16px; margin: 0; accent-color: var(--blue); }
    .secondary-button {
      padding: 6px 0;
      color: #71809a;
      font-size: 12px;
      background: transparent;
      border: 0;
    }
    .secondary-button:hover { color: var(--blue); text-decoration: underline; text-underline-offset: 3px; }
    .secondary-button:disabled { cursor: not-allowed; color: #b7c2d1; text-decoration: none; }

    .completion-message {
      min-height: 19px;
      margin: 18px 0 0;
      color: var(--green);
      font-size: 12px;
      font-weight: 700;
      text-align: center;
    }
    .completion-message:empty { margin-top: 0; }

    .progress-card {
      margin-top: 17px;
      padding: 19px 21px;
      border-radius: var(--radius-md);
    }

    .progress-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .progress-title { margin: 0; color: var(--navy); font-size: 14px; font-weight: 800; }
    .progress-number { margin: 0; color: var(--blue); font-size: 13px; font-weight: 800; }
    .progress-caption { display: flex; justify-content: space-between; gap: 12px; margin-top: 8px; color: var(--muted); font-size: 11px; }
    .progress-track { height: 8px; margin-top: 13px; overflow: hidden; background: #edf3fb; border-radius: 999px; }
    .progress-fill { width: 0; height: 100%; background: var(--blue); border-radius: inherit; transition: width 360ms ease; }
    .details-toggle { float: right; margin-top: 9px; }
    .progress-details { display: none; clear: both; grid-template-columns: 1fr 1fr; gap: 14px; padding-top: 15px; }
    .progress-details.open { display: grid; }
    .detail-column { min-width: 0; padding: 12px; background: var(--blue-wash); border-radius: 12px; }
    .detail-column h3 { margin: 0 0 8px; color: var(--navy); font-size: 11px; }
    .detail-column p { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.7; word-break: break-all; }

    /* =========================
       右侧学生名单
       ========================= */
    .roster-panel { min-width: 0; padding-top: 66px; }
    .roster-card { display: flex; flex-direction: column; height: calc(100vh - 90px); min-height: 560px; max-height: 760px; padding: 21px 17px 15px; border-radius: var(--radius-lg); }
    .roster-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 3px 16px; border-bottom: 1px solid #edf2f8; }
    .roster-head h2 { margin: 0; color: var(--navy); font-size: 16px; }
    .roster-count { color: var(--muted); font-size: 12px; font-weight: 400; }
    .add-button { display: inline-flex; align-items: center; gap: 5px; padding: 6px 0; color: var(--blue); font-size: 12px; font-weight: 700; background: transparent; border: 0; }
    .add-button:hover { color: var(--blue-dark); text-decoration: underline; text-underline-offset: 3px; }
    .add-button svg { width: 15px; height: 15px; }
    .roster-list { flex: 1; min-height: 0; margin: 0 -5px; padding: 10px 5px; overflow-y: auto; overscroll-behavior: contain; scrollbar-color: #c8dcf4 transparent; scrollbar-width: thin; }
    .roster-list::-webkit-scrollbar { width: 6px; }
    .roster-list::-webkit-scrollbar-thumb { background: #c8dcf4; border-radius: 999px; }
    .student-row { display: flex; align-items: center; gap: 9px; min-height: 38px; padding: 0 8px; border-radius: 10px; transition: background 160ms ease; }
    .student-row:hover { background: var(--blue-wash); }
    .student-index { width: 22px; color: #9aabc1; font-size: 11px; text-align: right; }
    .student-name { min-width: 0; flex: 1; overflow: hidden; color: #415875; font-size: 13px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
    .student-status { display: grid; width: 20px; height: 20px; place-items: center; color: #bbc8d8; font-size: 13px; }
    .student-status.picked { color: var(--green); font-weight: 900; }
    .empty-roster { display: grid; min-height: 180px; place-items: center; padding: 20px; color: var(--muted); font-size: 13px; line-height: 1.8; text-align: center; }
    .empty-roster .empty-icon { display: grid; width: 44px; height: 44px; margin: 0 auto 9px; place-items: center; color: #8fbff2; background: var(--blue-pale); border-radius: 50%; }
    .roster-foot { margin-top: auto; padding: 13px 9px 3px; color: var(--muted); font-size: 11px; line-height: 1.65; border-top: 1px solid #edf2f8; }
    .roster-foot strong { display: block; color: var(--navy); font-size: 12px; }

    /* =========================
       抽屉 / 弹窗
       ========================= */
    .modal-backdrop { position: fixed; z-index: 20; inset: 0; display: none; align-items: center; justify-content: center; padding: 20px; background: rgba(18, 62, 138, 0.17); }
    .modal-backdrop.open { display: flex; animation: fadeIn 150ms ease both; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .modal { width: min(580px, 100%); max-height: min(700px, calc(100vh - 40px)); overflow: auto; padding: 25px; background: var(--white); border: 1px solid #d7e6f7; border-radius: 21px; box-shadow: var(--shadow-md); animation: modalIn 180ms ease both; }
    .modal.wide { width: min(760px, 100%); }
    @keyframes modalIn { from { opacity: 0; transform: translateY(10px) scale(0.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; }
    .modal-head h2 { margin: 0; color: var(--navy); font-size: 20px; }
    .modal-head p { margin: 7px 0 0; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .close-button { display: grid; flex: 0 0 auto; width: 32px; height: 32px; place-items: center; color: #7990ae; background: var(--blue-wash); border: 0; border-radius: 10px; }
    .close-button:hover { color: var(--blue); background: var(--blue-pale); }
    .close-button svg { width: 16px; height: 16px; }
    .modal-body { margin-top: 22px; }
    .field-label { display: block; margin-bottom: 9px; color: var(--navy); font-size: 13px; font-weight: 800; }
    .name-editor { width: 100%; min-height: 250px; padding: 15px; resize: vertical; color: var(--ink); font-size: 14px; line-height: 1.8; background: #fbfdff; border: 1px solid #cfe1f4; border-radius: 13px; }
    .field-hint { margin: 8px 0 0; color: var(--muted); font-size: 11px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
    .ghost-button, .blue-button, .danger-button { min-height: 40px; padding: 0 16px; font-size: 13px; font-weight: 700; border-radius: 11px; transition: transform 140ms ease, background 140ms ease; }
    .ghost-button { color: #647894; background: var(--white); border: 1px solid var(--line); }
    .ghost-button:hover { background: var(--blue-wash); transform: translateY(-1px); }
    .blue-button { color: var(--white); background: var(--blue); border: 1px solid var(--blue); }
    .blue-button:hover { background: var(--blue-dark); transform: translateY(-1px); }
    .danger-button { color: #d55e5e; background: #fff7f7; border: 1px solid #f1d6d6; }
    .danger-button:hover { background: #ffeded; transform: translateY(-1px); }

    .history-list { max-height: 425px; overflow: auto; padding-right: 3px; }
    .history-item { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 15px; padding: 13px 3px; border-bottom: 1px solid #edf2f8; }
    .history-item:last-child { border-bottom: 0; }
    .history-name { color: var(--navy); font-size: 13px; font-weight: 800; }
    .history-meta { margin-top: 4px; color: var(--muted); font-size: 11px; }
    .history-rank { color: var(--blue); font-size: 11px; font-weight: 800; white-space: nowrap; }
    .empty-state { padding: 37px 12px; color: var(--muted); font-size: 13px; text-align: center; }

    .class-list { display: grid; gap: 8px; margin-bottom: 17px; }
    .class-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 49px; padding: 0 13px; color: var(--ink); background: var(--blue-wash); border: 1px solid transparent; border-radius: 12px; }
    .class-item.current { color: var(--blue); background: var(--blue-pale); border-color: #c9e0f8; }
    .class-item-name { min-width: 0; overflow: hidden; font-size: 13px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
    .class-item-actions { display: flex; flex: 0 0 auto; gap: 5px; }
    .mini-button { width: 28px; height: 28px; color: #7890ac; background: transparent; border: 0; border-radius: 8px; }
    .mini-button:hover { color: var(--blue); background: var(--white); }
    .mini-button.danger:hover { color: #d55e5e; }
    .mini-button svg { width: 15px; height: 15px; }
    .new-class-row { display: flex; gap: 8px; }
    .text-input { min-width: 0; flex: 1; min-height: 40px; padding: 0 12px; color: var(--ink); background: #fbfdff; border: 1px solid #cfe1f4; border-radius: 11px; outline: none; }
    .text-input::placeholder { color: #a5b4c8; }

    .toast { position: fixed; z-index: 30; right: 24px; bottom: 24px; max-width: min(340px, calc(100vw - 48px)); padding: 12px 15px; color: var(--white); font-size: 12px; line-height: 1.5; background: var(--navy); border-radius: 11px; box-shadow: var(--shadow-md); opacity: 0; pointer-events: none; transform: translateY(12px); transition: opacity 180ms ease, transform 180ms ease; }
    .toast.show { opacity: 1; transform: translateY(0); }

    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

    @media (max-width: 1180px) {
      .app-shell { grid-template-columns: 86px minmax(0, 1fr) 290px; gap: 17px; padding: 17px; }
      .sidebar { min-height: calc(100vh - 34px); padding-right: 10px; padding-left: 10px; }
      .brand { justify-content: center; padding: 0; }
      .brand-copy, .nav-button span:last-child, .sidebar-note { display: none; }
      .nav-list { margin-top: 38px; }
      .nav-button { justify-content: center; padding: 0; }
      .sidebar-sketch { right: 5px; left: 5px; width: auto; }
      .roster-panel { padding-top: 67px; }
    }

    @media (max-width: 820px) {
      .app-shell { grid-template-columns: 1fr; padding: 12px; }
      .sidebar { display: flex; flex-direction: row; align-items: center; min-height: 65px; padding: 10px 13px; border-radius: 17px; }
      .brand { justify-content: flex-start; }
      .brand-copy { display: block; }
      .brand-title { font-size: 15px; }
      .brand-subtitle { display: none; }
      .nav-list { display: flex; flex: 1; justify-content: flex-end; gap: 3px; margin: 0 0 0 13px; }
      .nav-button { width: 43px; min-height: 42px; }
      .nav-button span:last-child { display: none; }
      .sidebar-sketch { display: none; }
      .topbar { margin-bottom: 12px; }
      .roster-panel { padding-top: 0; }
      .roster-card { height: auto; min-height: 0; max-height: none; }
      .roster-list { max-height: 350px; }
    }

    @media (max-width: 540px) {
      .topbar { align-items: flex-start; }
      .topbar-context p { font-size: 11px; }
      .topbar-context strong { font-size: 13px; }
      .topbar-actions { flex-wrap: wrap; justify-content: flex-end; }
      .class-select-wrap { min-width: 132px; }
      .sound-button { min-width: 40px; padding: 0 10px; }
      .sound-button span { display: none; }
      .rollcall-card { min-height: 480px; padding: 28px 17px 23px; }
      .name-stage { min-height: 205px; }
      .name-display { font-size: clamp(53px, 17vw, 85px); letter-spacing: 0.05em; }
      .name-stage::before, .name-stage::after { width: 30px; }
      .mode-row { flex-wrap: wrap; gap: 10px 17px; margin-top: 21px; }
      .progress-details { grid-template-columns: 1fr; }
      .modal { padding: 20px 17px; }
      .modal-actions { flex-wrap: wrap; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    }

    /* ==========================================
       课堂刊物 · 暖白纸张视觉系统
       仅替换呈现层，保留全部业务逻辑与 DOM 标识
       ========================================== */
    :root {
      --journal-paper: #f4ede2;
      --journal-sheet: #fffdf8;
      --journal-ink: #1f355f;
      --journal-blue: #275ab0;
      --journal-blue-deep: #173b78;
      --journal-brick: #c95a3c;
      --journal-green: #3c8a68;
      --journal-line: #d8cfc0;
      --journal-muted: #7f7a72;
    }

    body {
      color: var(--journal-ink);
      background: var(--journal-paper);
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    }

    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
      outline: 2px solid var(--journal-brick);
      outline-offset: 3px;
    }

    .app-shell {
      grid-template-columns: minmax(180px, 14%) minmax(0, 1fr) minmax(255px, 22%);
      gap: 0;
      width: min(1560px, calc(100% - 40px));
      min-height: calc(100vh - 40px);
      margin: 20px auto;
      padding: 0;
      overflow: hidden;
      background: var(--journal-sheet);
      border: 1px solid var(--journal-line);
    }

    .sidebar, .rollcall-card, .progress-card, .roster-card {
      background: transparent;
      border: 0;
      border-radius: 0;
      box-shadow: none;
    }

    /* 左侧：刊物目录 */
    .sidebar {
      min-height: 100%;
      padding: 30px 17px 22px;
      overflow: visible;
      background: #faf6ee;
      border-right: 1px solid var(--journal-line);
    }

    .brand { align-items: flex-start; gap: 10px; padding: 0 1px; }
    .brand-mark {
      width: 35px;
      height: 35px;
      color: var(--journal-sheet);
      background: var(--journal-blue);
      border-radius: 0;
      box-shadow: 3px 3px 0 var(--journal-brick);
    }
    .brand-mark svg { width: 20px; height: 20px; }
    .brand-copy::before {
      display: block;
      margin-bottom: 6px;
      color: var(--journal-brick);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .16em;
      content: "课堂刊物 / 01";
    }
    .brand-title {
      color: var(--journal-ink);
      font-family: "Songti SC", "STSong", SimSun, serif;
      font-size: 16px;
      line-height: 1.18;
      letter-spacing: .04em;
      white-space: nowrap;
    }
    .brand-subtitle {
      margin-top: 8px;
      color: var(--journal-muted);
      font-size: 11px;
      line-height: 1.65;
    }

    .nav-list {
      gap: 0;
      margin-top: 46px;
      border-top: 1px solid var(--journal-line);
      counter-reset: journal-section;
    }
    .nav-button {
      position: relative;
      min-height: 51px;
      padding: 0 2px;
      color: #6d7074;
      background: transparent;
      border-radius: 0;
      border-bottom: 1px solid var(--journal-line);
      counter-increment: journal-section;
      transition: color 150ms ease, background 150ms ease, padding 150ms ease;
    }
    .nav-button::before {
      width: 27px;
      color: #aaa396;
      font-family: Georgia, serif;
      font-size: 11px;
      content: counter(journal-section, decimal-leading-zero);
    }
    .nav-button:hover { color: var(--journal-blue); background: #f1ebdf; transform: none; }
    .nav-button.active {
      padding-left: 8px;
      color: var(--journal-blue-deep);
      background: transparent;
      font-weight: 800;
      box-shadow: inset 3px 0 0 var(--journal-brick);
    }
    .nav-icon { display: none; }
    .nav-button span:last-child { font-size: 13px; }

    .sidebar-note {
      margin: auto 1px 0;
      padding: 17px 0 0;
      color: var(--journal-ink);
      background: transparent;
      border-top: 1px solid var(--journal-line);
      border-radius: 0;
    }
    .sidebar-note::before {
      display: block;
      margin-bottom: 7px;
      color: var(--journal-brick);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .16em;
      content: "编辑手记";
    }
    .sidebar-note p { color: var(--journal-muted); font-size: 11px; line-height: 1.8; }
    .sidebar-note strong { color: var(--journal-ink); font-family: "Songti SC", "STSong", SimSun, serif; font-size: 13px; }
    .sidebar-sketch { display: none; }

    /* 中间：姓名海报 */
    .main-column {
      min-width: 0;
      padding: 0 clamp(24px, 4vw, 58px) 35px;
      background: var(--journal-sheet);
    }
    .topbar {
      min-height: 82px;
      margin: 0;
      padding: 17px 0;
      border-bottom: 1px solid var(--journal-line);
    }
    .topbar-context p {
      color: var(--journal-brick);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .12em;
    }
    .topbar-context strong {
      margin-top: 5px;
      color: var(--journal-ink);
      font-family: "Songti SC", "STSong", SimSun, serif;
      font-size: 17px;
      font-weight: 700;
    }
    .topbar-actions { gap: 13px; }
    .class-select-wrap { min-width: 154px; }
    .class-select-wrap svg { display: none; }
    .class-select {
      padding: 8px 22px 8px 0;
      color: var(--journal-ink);
      font-size: 12px;
      font-weight: 700;
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--journal-ink);
      border-radius: 0;
      box-shadow: none;
    }
    .sound-button, .icon-button {
      min-height: 32px;
      padding: 0 0 0 10px;
      color: var(--journal-muted);
      background: transparent;
      border: 0;
      border-left: 1px solid var(--journal-line);
      border-radius: 0;
    }
    .sound-button:hover, .icon-button:hover {
      color: var(--journal-blue);
      background: transparent;
      border-color: var(--journal-line);
      transform: none;
    }
    .sound-button.on { color: var(--journal-green); background: transparent; border-color: var(--journal-line); }

    .rollcall-card {
      min-height: 550px;
      margin-top: 30px;
      padding: 68px clamp(16px, 4vw, 60px) 25px;
      overflow: hidden;
      background: #fffdfa;
      border-top: 8px solid var(--journal-blue);
      border-bottom: 1px solid var(--journal-line);
    }
    .rollcall-card::before {
      position: absolute;
      top: 17px;
      left: clamp(16px, 4vw, 60px);
      color: var(--journal-blue);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .15em;
      content: "ROLL CALL  /  今日课堂";
    }
    .rollcall-card::after {
      position: absolute;
      top: 15px;
      right: clamp(16px, 4vw, 60px);
      width: 28px;
      height: 28px;
      content: "";
      border: 1px solid var(--journal-brick);
    }
    .paper-dot { display: none; }
    .rollcall-heading { text-align: left; }
    .eyebrow {
      gap: 9px;
      color: var(--journal-muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
    }
    .eyebrow::before, .eyebrow::after { width: 16px; background: var(--journal-brick); }

    .name-stage {
      min-height: 278px;
      margin-top: 8px;
      padding: 18px 0 3px;
      border-top: 1px solid var(--journal-line);
      border-bottom: 1px solid var(--journal-line);
    }
    .name-stage::before {
      top: 17px;
      left: 0;
      width: auto;
      height: auto;
      color: var(--journal-brick);
      font-family: Georgia, serif;
      font-size: 11px;
      font-style: italic;
      letter-spacing: .08em;
      opacity: 1;
      background: transparent;
      transform: none;
      content: "名 字";
    }
    .name-stage::after {
      top: auto;
      right: 0;
      bottom: 18px;
      width: 40px;
      height: 1px;
      opacity: 1;
      background: var(--journal-blue);
      transform: none;
      content: "";
    }
    .name-display {
      max-width: 94%;
      padding: 12px 14px 33px;
      color: var(--journal-ink);
      font-family: "Songti SC", "STSong", SimSun, "Microsoft YaHei", serif;
      font-size: clamp(70px, 8.2vw, 146px);
      font-weight: 700;
      letter-spacing: .12em;
      text-shadow: none;
    }
    .name-display::after {
      right: 24%;
      bottom: 7px;
      left: 24%;
      height: 4px;
      background: var(--journal-brick);
      border-radius: 0;
      opacity: .9;
      transform: rotate(-1.2deg);
    }
    .name-display.rolling {
      color: var(--journal-blue);
      opacity: .9;
      animation: paperFlicker 110ms steps(2, end) infinite;
    }
    .name-display.celebrate { animation: paperLand 380ms cubic-bezier(.18,.8,.35,1.18); }
    @keyframes paperFlicker {
      0% { transform: translateY(-2px); }
      100% { transform: translateY(2px); }
    }
    @keyframes paperLand {
      0% { transform: scale(.965) translateY(-5px); }
      60% { transform: scale(1.028) translateY(1px); }
      100% { transform: scale(1) translateY(0); }
    }
    .result-sparkles { inset: 0; }
    .spark { display: none; }
    .result-sparkles::after {
      position: absolute;
      right: 12%;
      top: 21%;
      padding: 4px 8px;
      color: var(--journal-brick);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .15em;
      border: 1px solid currentColor;
      opacity: 0;
      transform: rotate(-8deg) scale(1.24);
      content: "已选中";
      pointer-events: none;
    }
    .name-display.celebrate + .result-sparkles::after { animation: inkStamp 650ms ease-out forwards; }
    @keyframes inkStamp {
      0% { opacity: 0; transform: rotate(-8deg) scale(1.28); }
      30% { opacity: .9; transform: rotate(-8deg) scale(.94); }
      100% { opacity: .7; transform: rotate(-8deg) scale(1); }
    }

    .rollcall-actions { justify-content: flex-start; margin-top: 25px; }
    .primary-button {
      min-width: 174px;
      min-height: 48px;
      padding: 0 20px;
      color: #fffdf8;
      font-size: 14px;
      background: var(--journal-blue);
      border: 0;
      border-radius: 0;
      box-shadow: 4px 4px 0 var(--journal-brick);
      transition: transform 140ms ease, background 140ms ease, box-shadow 140ms ease;
    }
    .primary-button:hover { background: var(--journal-blue-deep); transform: translate(-1px, -1px); box-shadow: 5px 5px 0 var(--journal-brick); }
    .primary-button:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--journal-brick); }
    .primary-button:disabled { color: #f3efe7; background: #8b9ab5; box-shadow: 3px 3px 0 #b3a698; }
    .primary-button svg { width: 15px; height: 15px; }
    .mode-row {
      justify-content: flex-start;
      gap: 22px;
      margin-top: 26px;
      padding-top: 16px;
      color: var(--journal-muted);
      border-top: 1px solid var(--journal-line);
    }
    .check-label input { accent-color: var(--journal-blue); }
    .check-label.round-rule { cursor: default; color: var(--journal-ink); }
    .check-label.round-rule input:disabled { cursor: default; opacity: 1; }
    .secondary-button { color: var(--journal-muted); font-size: 12px; }
    .secondary-button:hover { color: var(--journal-blue); }
    .completion-message { color: var(--journal-green); text-align: left; }

    /* 下方：点名刻度尺 */
    .progress-card {
      margin-top: 0;
      padding: 25px 0 0;
      background: transparent;
      border: 0;
    }
    .progress-top { align-items: baseline; }
    .progress-title {
      color: var(--journal-ink);
      font-family: "Songti SC", "STSong", SimSun, serif;
      font-size: 16px;
    }
    .progress-number { color: var(--journal-blue); font-family: Georgia, serif; font-size: 14px; }
    .progress-caption { margin-top: 7px; color: var(--journal-muted); }
    .progress-track { height: 4px; margin-top: 13px; background: #ded5c8; border-radius: 0; }
    .progress-fill { background: var(--journal-blue); border-radius: 0; }
    .details-toggle { margin-top: 11px; }
    .progress-details { gap: 0; padding-top: 12px; border-top: 1px solid var(--journal-line); }
    .detail-column { padding: 10px 14px 10px 0; background: transparent; border-radius: 0; }
    .detail-column + .detail-column { padding-left: 14px; border-left: 1px solid var(--journal-line); }
    .detail-column h3 { color: var(--journal-blue); font-size: 11px; letter-spacing: .06em; }
    .detail-column p { color: var(--journal-muted); }

    /* 右侧：出席册 */
    .roster-panel {
      min-width: 0;
      padding: 0;
      background: #faf6ee;
      border-left: 1px solid var(--journal-line);
    }
    .roster-card {
      height: 100%;
      min-height: calc(100vh - 42px);
      max-height: none;
      padding: 29px 18px 18px;
    }
    .roster-card::before {
      display: block;
      margin: 0 3px 15px;
      color: var(--journal-brick);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .16em;
      content: "出席册 / CLASS LIST";
    }
    .roster-head { padding: 0 3px 13px; border-bottom: 2px solid var(--journal-ink); }
    .roster-head h2 { color: var(--journal-ink); font-family: "Songti SC", "STSong", SimSun, serif; font-size: 17px; }
    .roster-count { color: var(--journal-muted); font-family: "Microsoft YaHei", sans-serif; font-size: 11px; }
    .add-button { color: var(--journal-blue); font-size: 12px; }
    .add-button:hover { color: var(--journal-brick); }
    .roster-list { margin: 0; padding: 6px 0; scrollbar-color: #b6ac9e transparent; }
    .roster-list::-webkit-scrollbar-thumb { background: #b6ac9e; border-radius: 0; }
    .student-row {
      min-height: 42px;
      padding: 0 2px;
      border-bottom: 1px solid var(--journal-line);
      border-radius: 0;
    }
    .student-row:hover { background: #f0eadf; }
    .student-index { width: 25px; color: #a29b90; font-family: Georgia, serif; font-size: 11px; }
    .student-name { color: #41516c; font-size: 13px; font-weight: 600; }
    .student-status { width: 18px; color: #b3ab9f; }
    .student-status.picked { color: var(--journal-green); }
    .empty-roster { color: var(--journal-muted); }
    .empty-roster .empty-icon { color: var(--journal-blue); background: transparent; border: 1px solid var(--journal-blue); border-radius: 0; }
    .roster-foot { padding: 14px 1px 1px; color: var(--journal-muted); border-top: 1px solid var(--journal-line); }
    .roster-foot strong { color: var(--journal-ink); font-family: "Songti SC", "STSong", SimSun, serif; }

    /* 纸张抽屉与表单 */
    .modal-backdrop { background: rgba(31, 53, 95, .25); }
    .modal {
      max-height: min(720px, calc(100vh - 40px));
      padding: 31px 28px 25px;
      background: var(--journal-sheet);
      border: 1px solid var(--journal-line);
      border-top: 8px solid var(--journal-blue);
      border-radius: 0;
      box-shadow: 10px 10px 0 rgba(31, 53, 95, .2);
    }
    .modal-head { padding-bottom: 16px; border-bottom: 1px solid var(--journal-line); }
    .modal-head h2 { color: var(--journal-ink); font-family: "Songti SC", "STSong", SimSun, serif; font-size: 21px; }
    .modal-head p { color: var(--journal-muted); }
    .close-button { color: var(--journal-muted); background: transparent; border: 1px solid var(--journal-line); border-radius: 0; }
    .close-button:hover { color: var(--journal-brick); background: transparent; }
    .field-label { color: var(--journal-ink); }
    .name-editor, .text-input {
      color: var(--journal-ink);
      background: #fffefa;
      border: 1px solid var(--journal-line);
      border-radius: 0;
    }
    .name-editor:focus, .text-input:focus { border-color: var(--journal-blue); }
    .field-hint, .history-meta, .empty-state { color: var(--journal-muted); }
    .ghost-button, .blue-button, .danger-button { border-radius: 0; }
    .ghost-button { color: var(--journal-ink); background: transparent; border-color: var(--journal-line); }
    .ghost-button:hover { color: var(--journal-blue); background: #f2ecdf; transform: none; }
    .blue-button { background: var(--journal-blue); border-color: var(--journal-blue); }
    .blue-button:hover { background: var(--journal-blue-deep); transform: none; }
    .danger-button { color: var(--journal-brick); background: transparent; border-color: #dab7ab; }
    .danger-button:hover { background: #fbefea; transform: none; }
    .history-item { border-bottom-color: var(--journal-line); }
    .history-name { color: var(--journal-ink); }
    .history-rank { color: var(--journal-blue); }
    .class-item { color: var(--journal-ink); background: transparent; border-color: var(--journal-line); border-radius: 0; }
    .class-item.current { color: var(--journal-blue); background: #f2ecdf; border-color: var(--journal-line); box-shadow: inset 3px 0 0 var(--journal-brick); }
    .mini-button { color: var(--journal-muted); border-radius: 0; }
    .mini-button:hover { color: var(--journal-blue); background: transparent; }
    .toast { right: 22px; bottom: 22px; color: #fffdf8; background: var(--journal-ink); border-radius: 0; box-shadow: 4px 4px 0 var(--journal-brick); }

    /* 保持刊物阅读顺序的响应式排版 */
    @media (max-width: 1180px) {
      .app-shell { grid-template-columns: 162px minmax(0, 1fr) 242px; width: min(calc(100% - 26px), 1560px); margin: 13px auto; }
      .sidebar { min-height: 100%; padding: 25px 14px 18px; }
      .brand { justify-content: flex-start; }
      .brand-copy, .nav-button span:last-child, .sidebar-note { display: block; }
      .nav-button { justify-content: flex-start; }
      .roster-panel { padding-top: 0; }
      .roster-card { min-height: calc(100vh - 28px); }
    }

    @media (max-width: 900px) {
      .app-shell { grid-template-columns: 84px minmax(0, 1fr) 230px; }
      .sidebar { padding: 22px 10px 14px; }
      .brand { justify-content: center; }
      .brand-copy, .sidebar-note { display: none; }
      .nav-list { margin-top: 40px; }
      .nav-button { justify-content: center; padding: 0; }
      .nav-button::before { display: none; }
      .nav-button span:last-child { display: none; }
      .nav-icon { display: grid; color: currentColor; }
      .rollcall-card { padding-right: 25px; padding-left: 25px; }
    }

    @media (max-width: 740px) {
      .app-shell { display: grid; grid-template-columns: 1fr; width: min(calc(100% - 20px), 650px); min-height: 0; margin: 10px auto; }
      .sidebar { display: flex; align-items: center; min-height: 66px; padding: 10px 14px; border-right: 0; border-bottom: 1px solid var(--journal-line); }
      .brand { flex: 0 1 auto; min-width: 0; justify-content: flex-start; }
      .brand-copy { display: block; }
      .brand-copy::before, .brand-subtitle { display: none; }
      .brand-title { font-size: 15px; }
      .brand-title { overflow: hidden; text-overflow: ellipsis; }
      .nav-list { display: flex; flex: 1 1 auto; min-width: 0; justify-content: flex-end; gap: 0; margin: 0 0 0 8px; border-top: 0; }
      .nav-button { flex: 1 1 0; width: auto; min-width: 0; min-height: 40px; border: 0; }
      .nav-button.active { padding-left: 0; box-shadow: inset 0 -3px 0 var(--journal-brick); }
      .main-column, .rollcall-card, .progress-card { max-width: 100%; }
      .main-column { padding: 0 18px 27px; }
      .topbar { min-height: 72px; }
      .roster-panel { border-top: 1px solid var(--journal-line); border-left: 0; }
      .roster-card { min-height: 0; height: auto; padding: 25px 18px 17px; }
      .roster-list { max-height: 360px; }
      .modal { padding: 25px 18px 20px; }
    }

    @media (max-width: 540px) {
      .topbar { gap: 9px; }
      .topbar-context p { letter-spacing: .06em; }
      .topbar-context strong { font-size: 14px; }
      .topbar-actions { gap: 8px; }
      .class-select-wrap { min-width: 125px; }
      .sound-button { min-width: 28px; padding-left: 8px; }
      .rollcall-card { min-height: 475px; margin-top: 20px; padding: 58px 16px 22px; }
      .rollcall-card::before { left: 16px; }
      .rollcall-card::after { right: 16px; }
      .name-stage { min-height: 236px; }
      .name-display { max-width: 100%; font-size: clamp(55px, 17vw, 85px); letter-spacing: .07em; }
      .name-display::after { right: 18%; left: 18%; }
      .mode-row { gap: 8px 18px; }
      .primary-button { min-width: 160px; }
      .progress-details { grid-template-columns: 1fr; }
      .progress-top { display: block; }
      .progress-number { display: block; margin: 5px 0 0; }
      .detail-column + .detail-column { padding-left: 0; border-top: 1px solid var(--journal-line); border-left: 0; }
      .result-sparkles::after { right: 7%; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="主导航">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">

  <!-- 统一弹窗：名单、记录、班级和详情均在此处离线完成 -->
  <div id="modalBackdrop" class="modal-backdrop" role="presentation">
    <section id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <div><h2 id="modalTitle">学生名单</h2><p id="modalDescription"></p></div>
        <button id="closeModalButton" class="close-button" type="button" aria-label="关闭弹窗">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18" /></svg>
        </button>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    /* =========================
       课堂随机点名 · 原生 JavaScript
       ========================= */
    (() => {
      'use strict';

      const STORAGE_KEY = 'classroom-random-rollcall-v1';
      const DEFAULT_STUDENTS = [
        '王小明', '李欣怡', '张子涵', '刘宇轩', '陈思远', '赵雨桐', '孙浩然', '周欣妍', '吴佳怡', '郑博文',
        '徐子墨', '黄梓轩', '杨皓然', '何雨彤', '林欣怡', '唐子轩', '马思远', '许嘉怡', '宋宇航', '韩雨桐'
      ];

      const $ = (selector) => document.querySelector(selector);
      const els = {
        classSelect: $('#classSelect'), todayContext: $('#todayContext'), nameDisplay: $('#nameDisplay'),
        startButton: $('#startButton'), noRepeatToggle: $('#noRepeatToggle'), resetRoundButton: $('#resetRoundButton'),
        completionMessage: $('#completionMessage'), progressNumber: $('#progressNumber'), remainingText: $('#remainingText'),
        progressPercent: $('#progressPercent'), progressFill: $('#progressFill'), pickedDetails: $('#pickedDetails'),
        unpickedDetails: $('#unpickedDetails'), detailsToggle: $('#detailsToggle'), progressDetails: $('#progressDetails'),
        rosterCount: $('#rosterCount'), rosterList: $('#rosterList'), soundToggle: $('#soundToggle'),
        addStudentButton: $('#addStudentButton'), modalBackdrop: $('#modalBackdrop'), modal: $('#modal'),
        modalTitle: $('#modalTitle'), modalDescription: $('#modalDescription'), modalBody: $('#modalBody'),
        closeModalButton: $('#closeModalButton'), toast: $('#toast')
      };

      let state = loadState();
      let isRolling = false;
      let animationFrame = 0;
      let toastTimer = 0;
      let currentModal = '';
      let lastFocusedElement = null;
      let audioContext = null;
      let lastRenderedClassId = '';

      function uid(prefix = 'id') {
        return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}`;
      }

      function defaultState() {
        const firstClass = { id: uid('class'), name: '四年级A班', students: [...DEFAULT_STUDENTS], picked: [], roundCount: 0, history: [] };
        return { classes: [firstClass], currentClassId: firstClass.id, noRepeat: true, soundOn: false };
      }

      function normalizeClass(item) {
        const students = Array.isArray(item.students) ? cleanNames(item.students.join('\n')) : [];
        const validPicked = Array.isArray(item.picked) ? item.picked.filter((name) => students.includes(name)) : [];
        const history = Array.isArray(item.history) ? item.history.filter((record) => record && typeof record.name === 'string') : [];
        return {
          id: item.id || uid('class'), name: String(item.name || '未命名班级').trim() || '未命名班级', students,
          picked: [...new Set(validPicked)], roundCount: Number.isFinite(item.roundCount) ? Math.max(0, item.roundCount) : validPicked.length,
          history: history.slice(0, 300)
        };
      }

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return defaultState();
          const parsed = JSON.parse(raw);
          const classes = Array.isArray(parsed.classes) && parsed.classes.length ? parsed.classes.map(normalizeClass) : defaultState().classes;
          const currentClassId = classes.some((item) => item.id === parsed.currentClassId) ? parsed.currentClassId : classes[0].id;
          return { classes, currentClassId, noRepeat: true, soundOn: parsed.soundOn === true };
        } catch (error) {
          return defaultState();
        }
      }

      function saveState() {
        // 不重复点名是固定课堂规则：旧版本保存的关闭状态也会在下次写入时自动修正。
        state.noRepeat = true;
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (error) { /* 隐私模式下仍可继续使用 */ }
      }

      // 首次打开立即落盘；同时将旧版本可能保存的“允许重复”状态统一修正为本轮不重复。
      try { saveState(); } catch (error) { /* 本地存储不可用时仍可使用当前页面 */ }

      function currentClass() {
        return state.classes.find((item) => item.id === state.currentClassId) || state.classes[0];
      }

      function cleanNames(value) {
        const list = Array.isArray(value) ? value : String(value || '').split(/\r?\n/);
        const result = [];
        const seen = new Set();
        list.forEach((name) => {
          const normalized = String(name).replace(/^\s+|\s+$/g, '');
          if (normalized && !seen.has(normalized)) { seen.add(normalized); result.push(normalized); }
        });
        return result;
      }

      function setActiveNav(view) {
        document.querySelectorAll('.nav-button').forEach((button) => {
          const active = button.dataset.view === view;
          button.classList.toggle('active', active);
          if (active) button.setAttribute('aria-current', 'page'); else button.removeAttribute('aria-current');
        });
      }

      function render() {
        const cls = currentClass();
        if (!cls) return;
        if (!isRolling && lastRenderedClassId !== cls.id) els.nameDisplay.textContent = cls.students[0] || '等待名单';
        lastRenderedClassId = cls.id;
        const pickedSet = new Set(cls.picked);
        const pickedCount = cls.picked.length;
        const total = cls.students.length;
        const remaining = Math.max(0, total - pickedCount);
        const percent = total ? Math.round((pickedCount / total) * 100) : 0;

        els.classSelect.innerHTML = state.classes.map((item) => `<option value="${escapeHtml(item.id)}">${escapeHtml(item.name)}</option>`).join('');
        els.classSelect.value = cls.id;
        els.todayContext.textContent = `${cls.name} · 课堂点名`;
        els.noRepeatToggle.checked = true;
        els.soundToggle.classList.toggle('on', state.soundOn);
        els.soundToggle.setAttribute('aria-pressed', String(state.soundOn));
        els.soundToggle.querySelector('span').textContent = state.soundOn ? '音效已开' : '音效';

        els.rosterCount.textContent = `（${total}人）`;
        els.progressNumber.textContent = `已点 ${pickedCount} / ${total}`;
        els.remainingText.textContent = total ? `未点 ${remaining} 人` : '还没有学生';
        els.progressPercent.textContent = `${percent}%`;
        els.progressFill.style.width = `${percent}%`;
        els.pickedDetails.textContent = pickedCount ? cls.students.filter((name) => pickedSet.has(name)).join('、') : '暂无';
        els.unpickedDetails.textContent = remaining ? cls.students.filter((name) => !pickedSet.has(name)).join('、') : '本轮已全部点到';
        els.resetRoundButton.disabled = pickedCount === 0 && cls.roundCount === 0;

        renderRoster(cls, pickedSet);
        updateCompletionMessage(cls);
      }

      function escapeHtml(value) {
        return String(value).replace(/[&<>'"]/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[char]));
      }

      function renderRoster(cls, pickedSet) {
        if (!cls.students.length) {
          els.rosterList.innerHTML = `<div class="empty-roster"><div><span class="empty-icon" aria-hidden="true">＋</span>还没有学生名单<br /><button class="blue-button" type="button" data-action="empty-add">添加学生</button></div></div>`;
          return;
        }
        els.rosterList.innerHTML = cls.students.map((name, index) => {
          const picked = pickedSet.has(name);
          return `<div class="student-row"><span class="student-index">${index + 1}.</span><span class="student-name" title="${escapeHtml(name)}">${escapeHtml(name)}</span><span class="student-status ${picked ? 'picked' : ''}" title="${picked ? '本轮已点到' : '本轮未点到'}">${picked ? '✓' : '○'}</span></div>`;
        }).join('');
      }

      function updateCompletionMessage(cls) {
        const complete = cls.students.length > 0 && cls.picked.length >= cls.students.length;
        els.completionMessage.textContent = complete ? '本轮点名已完成！ 点击“开始新一轮”，所有同学将重新进入候选池。' : '';
        els.startButton.disabled = isRolling;
        els.startButton.querySelector('span').textContent = complete ? '开始新一轮' : (isRolling ? '点名中...' : '开始点名');
      }

      function chooseRandom(list) {
        return list[Math.floor(Math.random() * list.length)];
      }

      function startRoll() {
        if (isRolling) return;
        const cls = currentClass();
        if (!cls.students.length) { openStudentEditor(); return; }
        const candidates = cls.students.filter((name) => !cls.picked.includes(name));
        if (!candidates.length) { updateCompletionMessage(cls); showToast('本轮点名已完成，请开始新一轮。'); return; }

        if (state.soundOn) playTone('start');
        isRolling = true;
        els.startButton.disabled = true;
        els.nameDisplay.classList.remove('celebrate');
        els.nameDisplay.classList.add('rolling');
        els.completionMessage.textContent = '';
        const startTime = performance.now();
        const duration = 1800 + Math.random() * 650;
        let nextSwap = startTime;

        const tick = (now) => {
          const progress = Math.min(1, (now - startTime) / duration);
          const ease = 1 - Math.pow(1 - progress, 3);
          const interval = 45 + ease * 185;
          if (now >= nextSwap) {
            els.nameDisplay.textContent = chooseRandom(candidates);
            nextSwap = now + interval;
            if (state.soundOn) playTone('tick', 0.035 + (1 - ease) * 0.02);
          }
          if (progress < 1) animationFrame = requestAnimationFrame(tick); else finishRoll(candidates);
        };
        animationFrame = requestAnimationFrame(tick);
      }

      function finishRoll(candidates) {
        const cls = currentClass();
        const finalName = chooseRandom(candidates);
        els.nameDisplay.textContent = finalName;
        els.nameDisplay.classList.remove('rolling');
        els.nameDisplay.classList.remove('celebrate');
        void els.nameDisplay.offsetWidth;
        els.nameDisplay.classList.add('celebrate');
        document.querySelectorAll('.spark').forEach((spark) => { spark.classList.remove('active'); void spark.offsetWidth; spark.classList.add('active'); });

        cls.roundCount += 1;
        if (!cls.picked.includes(finalName)) cls.picked.push(finalName);
        cls.history.unshift({ name: finalName, time: formatTime(new Date()), date: formatDate(new Date()), round: cls.roundCount });
        cls.history = cls.history.slice(0, 300);
        isRolling = false;
        saveState();
        render();
        if (state.soundOn) playTone('finish');
      }

      function resetRound(ask = true) {
        const cls = currentClass();
        if (!cls || (cls.picked.length === 0 && cls.roundCount === 0)) return;
        if (ask && !window.confirm('确定要重置本轮点名记录吗？')) return;
        cancelRolling();
        cls.picked = [];
        cls.roundCount = 0;
        saveState();
        els.nameDisplay.textContent = cls.students[0] || '等待名单';
        render();
        showToast('本轮点名已重置。');
      }

      function cancelRolling() {
        if (animationFrame) cancelAnimationFrame(animationFrame);
        animationFrame = 0;
        isRolling = false;
        els.nameDisplay.classList.remove('rolling');
      }

      function formatTime(date) { return date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }); }
      function formatDate(date) { return date.toLocaleDateString('zh-CN', { month: 'numeric', day: 'numeric' }); }

      function showToast(message) {
        clearTimeout(toastTimer);
        els.toast.textContent = message;
        els.toast.classList.add('show');
        toastTimer = window.setTimeout(() => els.toast.classList.remove('show'), 2500);
      }

      function openModal(type) {
        lastFocusedElement = document.activeElement;
        currentModal = type;
        els.modal.classList.toggle('wide', type === 'history' || type === 'classes');
        els.modalBackdrop.classList.add('open');
        document.body.style.overflow = 'hidden';
        if (type === 'students') renderStudentEditor();
        if (type === 'history') renderHistory();
        if (type === 'classes') renderClassManager();
      }

      function closeModal() {
        els.modalBackdrop.classList.remove('open');
        document.body.style.overflow = '';
        currentModal = '';
        setActiveNav('rollcall');
        if (lastFocusedElement && typeof lastFocusedElement.focus === 'function') lastFocusedElement.focus();
      }

      function openStudentEditor() {
        setActiveNav('students');
        openModal('students');
      }

      function renderStudentEditor() {
        const cls = currentClass();
        els.modalTitle.textContent = '学生名单';
        els.modalDescription.textContent = `${cls.name} · 一行一个姓名，粘贴 Excel 一列也可以。`;
        els.modalBody.innerHTML = `<label class="field-label" for="nameEditor">名单内容</label><textarea id="nameEditor" class="name-editor" spellcheck="false" placeholder="例如：\n王小明\n李欣怡\n张子涵">${escapeHtml(cls.students.join('\n'))}</textarea><p class="field-hint">保存时会自动去掉空行、首尾空格，并合并重复姓名。</p><div class="modal-actions"><button id="clearNamesButton" class="ghost-button" type="button">清空</button><button id="cancelNamesButton" class="ghost-button" type="button">取消</button><button id="saveNamesButton" class="blue-button" type="button">保存名单</button></div>`;
        $('#clearNamesButton').addEventListener('click', () => { $('#nameEditor').value = ''; $('#nameEditor').focus(); });
        $('#cancelNamesButton').addEventListener('click', closeModal);
        $('#saveNamesButton').addEventListener('click', saveStudentEditor);
        window.setTimeout(() => $('#nameEditor')?.focus(), 0);
      }

      function saveStudentEditor() {
        const editor = $('#nameEditor');
        const cls = currentClass();
        if (!editor || !cls) return;
        const before = cls.students.length;
        cls.students = cleanNames(editor.value);
        cls.picked = cls.picked.filter((name) => cls.students.includes(name));
        if (!cls.students.length) { cls.picked = []; cls.roundCount = 0; }
        saveState();
        if (!cls.students.includes(els.nameDisplay.textContent)) els.nameDisplay.textContent = cls.students[0] || '等待名单';
        closeModal();
        render();
        showToast(`名单已保存，共 ${cls.students.length} 人。${before !== cls.students.length ? '' : ''}`);
      }

      function renderHistory() {
        const cls = currentClass();
        els.modalTitle.textContent = '点名记录';
        els.modalDescription.textContent = `${cls.name} · 最近记录显示在前面，最多保留 300 条。`;
        const history = cls.history || [];
        const listHtml = history.length ? `<div class="history-list">${history.map((record) => `<div class="history-item"><div><div class="history-name">${escapeHtml(record.name)}</div><div class="history-meta">${escapeHtml(record.date || '')} ${escapeHtml(record.time || '')} · ${escapeHtml(cls.name)}</div></div><div class="history-rank">第${Number(record.round) || 1}位</div></div>`).join('')}</div>` : '<div class="empty-state">还没有点名记录<br />开始一次点名，记录就会出现在这里。</div>';
        els.modalBody.innerHTML = `${listHtml}<div class="modal-actions"><button id="clearHistoryButton" class="danger-button" type="button" ${history.length ? '' : 'disabled'}>清空记录</button><button id="historyDoneButton" class="blue-button" type="button">完成</button></div>`;
        $('#clearHistoryButton').addEventListener('click', () => {
          if (!history.length) return;
          if (window.confirm('确定要清空当前班级的点名记录吗？')) { cls.history = []; saveState(); renderHistory(); showToast('点名记录已清空。'); }
        });
        $('#historyDoneButton').addEventListener('click', closeModal);
      }

      function renderClassManager() {
        els.modalTitle.textContent = '班级管理';
        els.modalDescription.textContent = '每个班级都拥有独立的学生名单、点名记录和本轮进度。';
        els.modalBody.innerHTML = `<div class="class-list">${state.classes.map((cls) => `<div class="class-item ${cls.id === state.currentClassId ? 'current' : ''}"><span class="class-item-name">${escapeHtml(cls.name)}${cls.id === state.currentClassId ? ' · 当前' : ''}</span><span class="class-item-actions"><button class="mini-button" type="button" data-action="rename-class" data-id="${escapeHtml(cls.id)}" title="修改班级名" aria-label="修改班级名"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m4 16.5-.8 3.8 3.8-.8L18.3 8.2 15.8 5.7zM14.7 6.8l2.5 2.5M20 4l-1-1a1.4 1.4 0 0 0-2 0l-1.2 1.2 3 3L20 6a1.4 1.4 0 0 0 0-2z" /></svg></button><button class="mini-button danger" type="button" data-action="delete-class" data-id="${escapeHtml(cls.id)}" title="删除班级" aria-label="删除班级"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14M10 11v6M14 11v6M8 7l.7-2h6.6l.7 2M7 7l.7 13h8.6L17 7" /></svg></button></span></div>`).join('')}</div><label class="field-label" for="newClassInput">新建班级</label><div class="new-class-row"><input id="newClassInput" class="text-input" type="text" maxlength="30" placeholder="例如：五年级B班" /><button id="createClassButton" class="blue-button" type="button">新建</button></div><div class="modal-actions"><button id="classDoneButton" class="blue-button" type="button">完成</button></div>`;
        els.modalBody.querySelectorAll('[data-action="rename-class"]').forEach((button) => button.addEventListener('click', () => renameClass(button.dataset.id)));
        els.modalBody.querySelectorAll('[data-action="delete-class"]').forEach((button) => button.addEventListener('click', () => deleteClass(button.dataset.id)));
        $('#createClassButton').addEventListener('click', createClass);
        $('#newClassInput').addEventListener('keydown', (event) => { if (event.key === 'Enter') createClass(); });
        $('#classDoneButton').addEventListener('click', closeModal);
      }

      function createClass() {
        const input = $('#newClassInput');
        const name = input?.value.trim();
        if (!name) { input?.focus(); showToast('请先输入班级名称。'); return; }
        if (state.classes.some((cls) => cls.name === name)) { input.focus(); showToast('这个班级已经存在。'); return; }
        const cls = { id: uid('class'), name, students: [], picked: [], roundCount: 0, history: [] };
        state.classes.push(cls);
        state.currentClassId = cls.id;
        saveState();
        render();
        renderClassManager();
        showToast(`已创建「${name}」。`);
      }

      function renameClass(id) {
        const cls = state.classes.find((item) => item.id === id);
        if (!cls) return;
        const nextName = window.prompt('请输入新的班级名称：', cls.name);
        if (nextName === null) return;
        const name = nextName.trim();
        if (!name) { showToast('班级名称不能为空。'); return; }
        if (state.classes.some((item) => item.id !== id && item.name === name)) { showToast('这个班级已经存在。'); return; }
        cls.name = name;
        saveState();
        render();
        renderClassManager();
        showToast('班级名称已修改。');
      }

      function deleteClass(id) {
        const cls = state.classes.find((item) => item.id === id);
        if (!cls) return;
        if (state.classes.length === 1) { showToast('至少需要保留一个班级。'); return; }
        if (!window.confirm(`确定要删除「${cls.name}」吗？该班级的名单和记录也会被删除。`)) return;
        state.classes = state.classes.filter((item) => item.id !== id);
        if (state.currentClassId === id) state.currentClassId = state.classes[0].id;
        saveState();
        render();
        renderClassManager();
        showToast('班级已删除。');
      }

      function playTone(type, volume = 0.055) {
        if (!state.soundOn) return;
        try {
          audioContext ||= new (window.AudioContext || window.webkitAudioContext)();
          const now = audioContext.currentTime;
          const oscillator = audioContext.createOscillator();
          const gain = audioContext.createGain();
          oscillator.type = 'sine';
          oscillator.frequency.setValueAtTime(type === 'finish' ? 660 : type === 'start' ? 420 : 250 + Math.random() * 80, now);
          if (type === 'finish') oscillator.frequency.exponentialRampToValueAtTime(880, now + 0.12);
          gain.gain.setValueAtTime(volume, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + (type === 'tick' ? 0.045 : 0.18));
          oscillator.connect(gain).connect(audioContext.destination);
          oscillator.start(now);
          oscillator.stop(now + (type === 'tick' ? 0.05 : 0.2));
        } catch (error) { /* 浏览器不支持声音时不影响点名 */ }
      }

      document.querySelectorAll('.nav-button').forEach((button) => {
        button.addEventListener('click', () => {
          const view = button.dataset.view;
          if (view === 'rollcall') { setActiveNav('rollcall'); closeModal(); return; }
          setActiveNav(view);
          if (view === 'students') openModal('students');
          if (view === 'history') openModal('history');
          if (view === 'classes') openModal('classes');
        });
      });

      els.startButton.addEventListener('click', () => {
        const cls = currentClass();
        if (cls.students.length && cls.picked.length >= cls.students.length) { resetRound(false); startRoll(); return; }
        startRoll();
      });
      els.resetRoundButton.addEventListener('click', () => resetRound(true));
      els.classSelect.addEventListener('change', () => { cancelRolling(); state.currentClassId = els.classSelect.value; saveState(); const cls = currentClass(); els.nameDisplay.textContent = cls.students[0] || '等待名单'; render(); });
      els.soundToggle.addEventListener('click', () => { state.soundOn = !state.soundOn; saveState(); render(); if (state.soundOn) playTone('finish', 0.07); });
      els.addStudentButton.addEventListener('click', openStudentEditor);
      els.rosterList.addEventListener('click', (event) => { if (event.target.closest('[data-action="empty-add"]')) openStudentEditor(); });
      els.detailsToggle.addEventListener('click', () => { const open = els.progressDetails.classList.toggle('open'); els.detailsToggle.setAttribute('aria-expanded', String(open)); els.detailsToggle.textContent = open ? '收起详情' : '查看详情'; });
      els.closeModalButton.addEventListener('click', closeModal);
      els.modalBackdrop.addEventListener('click', (event) => { if (event.target === els.modalBackdrop) closeModal(); });

      document.addEventListener('keydown', (event) => {
        const tag = document.activeElement?.tagName?.toLowerCase();
        const editing = tag === 'input' || tag === 'textarea' || tag === 'select' || document.activeElement?.isContentEditable;
        if (event.key === 'Escape') { if (currentModal) closeModal(); return; }
        if (editing) return;
        if (event.code === 'Space') { event.preventDefault(); els.startButton.click(); }
        if (event.key.toLowerCase() === 'r') els.resetRoundButton.click();
      });

      render();
    })();
  </script>
</body>
</html>
